# One time helper: downloads recent public Instagram photos into _ig/ and commits them. Safe to delete afterwards.
name: Fetch Instagram photos

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_instagram.py
      - .github/workflows/fetch-instagram.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos
        run: python3 scripts/fetch_instagram.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _ig
          git diff --cached --quiet || git commit -m "Fetch Instagram photos"
          git push
