# One time helper: copies images (and page sources for reference) from the
# old Google Site into the repo, then commits them. Safe to delete afterwards.
name: Mirror Google Site assets

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/mirror_google_site.py
      - .github/workflows/mirror-google-site.yml

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download page sources and images
        run: python3 scripts/mirror_google_site.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets _source
          git diff --cached --quiet || git commit -m "Mirror images from the Google Site"
          git push
