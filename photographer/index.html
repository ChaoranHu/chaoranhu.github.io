<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

<body>
  <header class="site-header">
    <div class="inner">
      <a class="site-title" href="../">Chaoran Hu</a>

  <main class="page wide">
    <!--
      To add a photo: put the image file in assets/img/<section>/ and copy one
      <figure> line inside that section's track, changing the file name.
      To add a section: copy a whole <h2> + <div class="carousel"> block.
      Buttons, dots and swiping are added automatically by assets/js/carousel.js.
    -->
    <h2>Wildlife</h2>
    <div class="carousel" aria-label="Wildlife photos">
      <div class="track" tabindex="0">
        <figure><img src="../assets/img/wildlife/01.jpg" alt="Wildlife photo by Chaoran Hu" loading="lazy"></figure>
        <figure><img src="../assets/img/wildlife/02.jpg" alt="Wildlife photo by Chaoran Hu" loading="lazy"></figure>
        <figure><img src="../assets/img/wildlife/03.jpg" alt="Wildlife photo by Chaoran Hu" loading="lazy"></figure>
        <figure><img src="../assets/img/wildlife/04.jpg" alt="Wildlife photo by Chaoran Hu" loading="lazy"></figure>
        <figure><img src="../assets/img/wildlife/05.jpg" alt="Wildlife photo by Chaoran Hu" loading="lazy"></figure>
        <figure><img src="../assets/img/wildlife/06.jpg" alt="Wildlife photo by Chaoran Hu" loading="lazy"></figure>
        <figure><img src="../assets/img/wildlife/07.jpg" alt="Wildlife photo by Chaoran Hu" loading="lazy"></figure>
      </div>
    </div>

    <h2>Nature</h2>
    <div class="carousel" aria-label="Nature photos">
      <div class="track" tabindex="0">
        <figure><img src="../assets/img/nature/01.jpg" alt="Nature photo by Chaoran Hu" loading="lazy"></figure>
        <figure><img src="../assets/img/nature/02.jpg" alt="Nature photo by Chaoran Hu" loading="lazy"></figure>

    <h2>Humanistics</h2>

    <p class="coming-soon">Coming soon.</p>
  </main>
  <footer class="site-footer">&copy; Chaoran Hu</footer>
