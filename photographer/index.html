<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chaoran Hu - Photographer</title>
  <meta property="og:title" content="Chaoran Hu">
  <meta property="og:type" content="website">
  <link rel="icon" href="../assets/img/hero.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css?v=8">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="site-title" href="../">Chaoran Hu</a>
    </div>
  </header>
  <main class="page wide">
    <!--
      Each section shows "Coming soon" until it has photos. To fill one, put the
      images in assets/img/<section>/ and replace its paragraph with a block like:

      <div class="carousel" aria-label="Wildlife photos">
        <div class="track" tabindex="0">
          <figure><img src="../assets/img/wildlife/01.jpg" alt="Wildlife photo by Chaoran Hu" loading="lazy"></figure>
        </div>
      </div>

      Add one <figure> line per photo. Buttons, dots and swiping are added
      automatically by assets/js/carousel.js.
    -->
    <h2>Wildlife</h2>
    <div class="carousel" aria-label="Wildlife photos">
      <div class="track" tabindex="0">
        <figure><img src="../assets/img/wildlife/01.jpg" alt="Bighorn sheep resting on a steep grassy slope" loading="lazy"></figure>
        <figure><img src="../assets/img/wildlife/02.jpg" alt="Sea lions sleeping in a pile" loading="lazy"></figure>
      </div>
    </div>

    <h2>Nature</h2>
    <div class="carousel" aria-label="Nature photos">
      <div class="track" tabindex="0">
        <figure><img src="../assets/img/nature/01.jpg" alt="Snowy peak in mist above a dark forest" loading="lazy"></figure>
        <figure><img src="../assets/img/nature/02.jpg" alt="Foggy forested coastline seen from above" loading="lazy"></figure>
        <figure><img src="../assets/img/nature/03.jpg" alt="Wave breaking against dark rocks" loading="lazy"></figure>
        <figure><img src="../assets/img/nature/04.jpg" alt="Mountain ridge wrapped in clouds, black and white" loading="lazy"></figure>
        <figure><img src="../assets/img/nature/05.jpg" alt="Low cloud drifting through a valley of pines" loading="lazy"></figure>
        <figure><img src="../assets/img/nature/06.jpg" alt="Crescent moon over a calm sea, black and white" loading="lazy"></figure>
        <figure><img src="../assets/img/nature/07.jpg" alt="Wind blown grass under a stormy sky, black and white" loading="lazy"></figure>
        <figure><img src="../assets/img/nature/08.jpg" alt="White lighthouse above coastal shrubs" loading="lazy"></figure>
        <figure><img src="../assets/img/nature/09.jpg" alt="Leaves on a branch, black and white" loading="lazy"></figure>
        <figure><img src="../assets/img/nature/10.jpg" alt="Dried sunflowers, black and white" loading="lazy"></figure>
      </div>
    </div>

    <h2>Humanistics</h2>
    <div class="carousel" aria-label="Humanistics photos">
      <div class="track" tabindex="0">
        <figure><img src="../assets/img/humanistics/01.jpg" alt="Child twirling in a sunlit dress, black and white" loading="lazy"></figure>
        <figure><img src="../assets/img/humanistics/02.jpg" alt="Child lying on a suitcase reading, black and white" loading="lazy"></figure>
        <figure><img src="../assets/img/humanistics/03.jpg" alt="Child dancing by a door, black and white" loading="lazy"></figure>
        <figure><img src="../assets/img/humanistics/04.jpg" alt="Child pulling a curtain in a dark room, black and white" loading="lazy"></figure>
      </div>
    </div>
  </main>
  <footer class="site-footer">&copy; Chaoran Hu</footer>
  <script src="../assets/js/carousel.js?v=8"></script>
</body>
</html>
